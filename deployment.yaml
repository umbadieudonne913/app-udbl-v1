apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-udbl-v1
  # Test SynopKube scan - ce commit devrait être REJETÉ car image :latest

spec:
  replicas: 1

  selector:
    matchLabels:
      app: app-udbl-v1

  template:
    metadata:
      labels:
        app: app-udbl-v1

    spec:
      containers:
      - name: app-udbl-v1
        image: umbadieudonne913/web-udbl:latest 

        ports:
        - containerPort: 80
