# deployment.yaml - 4 SECRETS EN CLAIR
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-udbl-v1
  labels:
    app: app-udbl-v1

spec:
  replicas: 1

  selector:
    matchLabels:
      app: app-udbl-v1

  template:
    metadata:
      labels:
        app: app-udbl-v1

    spec:
      containers:
      - name: app-udbl-v1
        image: umbadieudonne913/web-udbl:latest 
        imagePullPolicy: IfNotPresent

        # SECRET 2: Mot de passe en clair
        env:
        - name: DB_PASSWORD
          value: "password123"
        - name: API_KEY
          value: "sk-12345-abcde-67890-fghij"  # SECRET 3: Clé API en clair
        - name: SECRET_TOKEN
          value: "github_pat_1234567890ABCDEF" # SECRET 4: Token en clair
        - name: REDIS_PASSWORD
          value: "redis_1234567890"

        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"

        # SECRET 5 (bonus): Root user
        securityContext:
          runAsNonRoot: false
          privileged: true