apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-udbl-v1

spec:
  replicas: 1

  selector:
    matchLabels:
      app: app-udbl-v1

  template:
    metadata:
      labels:
        app: app-udbl-v1

    spec:
      containers:
      - name: app-udbl-v1
        image: umbadieudonne913/web-udbl:latest 

        ports:
        - containerPort: 80

---

apiVersion: v1
kind: Service

metadata:
  name: app-udbl-v1-service

spec:
  selector:
    app: app-udbl-v1

  ports:
  - protocol: TCP
    port: 80
    targetPort: 80

  type: ClusterIP
